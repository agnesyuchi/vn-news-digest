name: Daily Vietnam/Laos News Digest

on:
  schedule:
    # UTC 00:00 = 越南時間 07:00 = 台灣時間 08:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點擊執行（方便測試）

permissions:
  contents: write   # 需要允許 workflow 將產生的 JSON 檔 commit 回 repo

jobs:
  build-digest:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出 repo 原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲與 Gemini 分類翻譯
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 將新資料 commit 回 repo
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新資料變動，略過 commit"
          else
            git commit -m "chore: update daily news digest ($(date -u +'%Y-%m-%d'))"
            git push
          fi
