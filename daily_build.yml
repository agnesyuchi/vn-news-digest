name: Daily Vietnam/Laos News Digest

on:
  # 原本這裡有 GitHub 自己的 schedule 排程（cron），但因排程觸發時間不穩定
  # （曾實測延遲近 4 小時才觸發），改由外部的 Google Apps Script 定時呼叫
  # GitHub API 觸發 workflow_dispatch，作為唯一的每日觸發來源，避免與
  # GitHub 內建排程重複觸發、多消耗 Gemini API 額度。
  workflow_dispatch: {}   # 允許手動點擊執行、或由外部 API 呼叫觸發（Apps Script 使用此方式）

permissions:
  contents: write   # 需要允許 workflow 將產生的 JSON 檔 commit 回 repo

jobs:
  build-digest:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出 repo 原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 安裝 Playwright 瀏覽器（用於繞過防爬蟲網站）
        run: playwright install --with-deps chromium

      - name: 執行爬蟲與 Gemini 分類翻譯
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 將新資料 commit 回 repo
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新資料變動，略過 commit"
          else
            git commit -m "chore: update daily news digest ($(date -u +'%Y-%m-%d'))"
            git push
          fi
